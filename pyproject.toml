[project]
name = "taffee-capabilities"
version = "0.1.0"
description = "Capability manifests, digests, labels and index for the Taffee capabilities pillar"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyyaml==6.0.2",
  "jsonschema==4.23.0",
  "cryptography==43.0.3",
  "google-re2==1.1.20251105",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["capability"]
