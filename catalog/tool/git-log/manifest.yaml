# 1.2.0 (S-009): declares postconditions. 1.1.0 added the Python implementation (T-001); 1.0.0 was declared with none. Workbench is reference only.
kind: tool
name: git-log
version: 1.2.0
owner: capabilities-tools-owner
summary: "Show the most recent commits on this repository's current branch."
implementations:
  - language: python
    location: library/git-log/python
requires:
  - repo.read
spec:
  inputSchema:
    type: object
    additionalProperties: false
    properties:
      n:
        type: integer
        minimum: 1
    required: [n]
  readOnly: true
  idempotent: true
  timeoutMs: 5000
  boundary: []
  postconditions:
    - type: max_bytes
      value: 25000
    - type: each_line_matches
      pattern: '[0-9a-f]{7,40} .+'
      allow_empty: true
