# 1.2.0 (S-009): declares postconditions. 1.1.0 added the Python implementation (T-001); 1.0.0 was declared with none. Workbench is reference only.
kind: tool
name: unawaited-async
version: 1.2.0
owner: capabilities-tools-owner
summary: "Find async functions whose body never uses await (TypeScript and JavaScript). Heuristic."
implementations:
  - language: python
    location: library/unawaited-async/python
requires:
  - repo.read
spec:
  inputSchema:
    type: object
    additionalProperties: false
    properties:
      files:
        type: string
    required: [files]
  readOnly: true
  idempotent: true
  timeoutMs: 5000
  boundary: []
  postconditions:
    - type: max_bytes
      value: 25000
    - type: each_line_matches
      pattern: 'No unawaited async functions found( in the files searched)?\.|.+:[0-9]+ — async function with no await|\[truncated: output exceeded [0-9]+ bytes\]'
      allow_empty: false
