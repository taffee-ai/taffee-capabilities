# The capabilities registry, as development services on one Docker host.
#
#   TAFFEE_RUN=/absolute/host/path docker compose -f deploy/compose.yaml up -d --build
#   TAFFEE_RUN=... docker compose -f deploy/compose.yaml --profile smoke run --rm smoke
#
# TAFFEE_RUN holds everything that must survive a restart: the store, the library export if on, the admission key,
# the dev feed, the sandbox scratch folder, the call records and the workspaces callers name in POST /v2/call
# (TAFFEE_RUN/workspaces/<name>: a caller on this host puts the files a tool should see there). It is mounted at the same absolute path in every container,
# because the registry starts sandbox containers through the host's Docker socket and they mount those paths.
#
# DEVELOPMENT ONLY: the authorizer trusts the X-Dev-Principal header, so the port is published on the host's
# loopback only. From another machine, use an SSH tunnel: ssh -L 8090:localhost:8090 <host>.
# When this moves to taffee-core infra/ (D-011), these services keep their names.

name: taffee-capabilities

services:
  sandbox:
    build: {context: .., dockerfile: deploy/Dockerfile.registry, target: sandbox}
    image: taffee-cap-sandbox:dev
    command: ["python", "-c", "print('sandbox image ready')"]

  feed:
    build: {context: .., dockerfile: deploy/Dockerfile.registry, target: registry}
    image: taffee-cap-registry:dev
    container_name: cap-feed
    command: ["dev-feed", "run", "--dir", "${TAFFEE_RUN:?set TAFFEE_RUN to an absolute host path}/feed", "--interval", "5"]
    volumes: ["${TAFFEE_RUN}:${TAFFEE_RUN}"]
    healthcheck:
      test: ["CMD", "test", "-s", "${TAFFEE_RUN}/feed/checkpoint.json"]
      interval: 2s
      retries: 15
    restart: unless-stopped

  registry:
    image: taffee-cap-registry:dev
    container_name: cap-registry
    depends_on:
      feed: {condition: service_healthy}
      sandbox: {condition: service_completed_successfully}
    command:
      - serve
      - --host=0.0.0.0
      - --port=8090
      - --create-key
      - --data=${TAFFEE_RUN}/registry
      # The library export is off unless TAFFEE_LIBRARY names a folder (under TAFFEE_RUN, which is mounted).
      # TAFFEE_LIBRARY_REMOTE pushes it to the enterprise's own git; key files must be under TAFFEE_RUN too.
      - --library=${TAFFEE_LIBRARY:-}
      - --library-remote=${TAFFEE_LIBRARY_REMOTE:-}
      - --library-ssh-key=${TAFFEE_LIBRARY_SSH_KEY:-}
      - --library-known-hosts=${TAFFEE_LIBRARY_KNOWN_HOSTS:-}
      - --work-dir=${TAFFEE_RUN}/work
      - --sandbox-image=taffee-cap-sandbox:dev
      - --feed-dir=${TAFFEE_RUN}/feed
      - --poll-seconds=5
      - --approval=${TAFFEE_APPROVAL:-auto}
      - --approver=approver:dev
      - --workers=${TAFFEE_WORKERS:-4}
      - --workspaces=${TAFFEE_RUN}/workspaces
      - --call-workers=${TAFFEE_CALL_WORKERS:-4}
    ports: ["127.0.0.1:${TAFFEE_PORT:-8090}:8090"]
    volumes:
      - "${TAFFEE_RUN}:${TAFFEE_RUN}"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8090/v2/checkpoint', headers={'X-Dev-Principal': 'healthcheck'}), timeout=3)"]
      interval: 3s
      retries: 40
    restart: unless-stopped

  smoke:
    image: taffee-cap-registry:dev
    profiles: ["smoke"]
    depends_on:
      registry: {condition: service_healthy}
    entrypoint: ["python", "/app/deploy/smoke.py"]
    environment:
      REGISTRY_URL: http://registry:8090
      TAFFEE_RUN: ${TAFFEE_RUN}
      TAFFEE_LIBRARY: ${TAFFEE_LIBRARY:-}
    volumes: ["${TAFFEE_RUN}:${TAFFEE_RUN}"]
